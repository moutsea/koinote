name: Actions Cache Cleanup

on:
  workflow_run:
    workflows: [Desktop Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actions-cache-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'desktop-v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      # Always use trusted maintenance code from the default branch.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: 验证缓存保留规则
        run: python3 scripts/test_prune_actions_caches.py

      - name: 保留最近两次发版缓存及各平台最新 npm 缓存
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/prune_actions_caches.py --repo "$GITHUB_REPOSITORY" --apply
