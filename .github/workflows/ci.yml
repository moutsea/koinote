name: CI

# 开源之后 CI 从"锦上添花"变成必需品：收到外部 PR 时，没有 CI 就等于每个 PR
# 都要手动 clone 下来跑全部前端断言 + go test，那个负担会直接变成"懒得看 PR"。
on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新 push 取消上一次未跑完的运行 —— 连续提交时不必等旧的跑完
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 前端 + Worker：typecheck 两端，再跑全部断言套件
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # npm ci 而不是 npm install：严格按 lock 文件装，
      # 装出来的依赖树和本地一致，否则 CI 绿了本地红也说明不了问题
      - run: npm ci

      # 这一步内含 typecheck:spa + typecheck:worker + 全部断言套件。
      # 串成一条是有意的：失败即停，第一个红的就是要看的那个。
      - run: npm test

      # 构建必须过。typecheck 过而 build 挂是可能的
      # （Vite 插件、KaTeX 字体复制这些只在构建期跑）
      - run: npm run build

      # 断言构建产物真的成型了。build 退出 0 但产物缺东西是有过的坑：
      # KaTeX 字体复制失败时只 warn 不报错（见 vite.config.ts 的注释）
      - name: 检查构建产物
        run: |
          test -f spa/dist/index.html || { echo "缺 index.html"; exit 1; }
          ls spa/dist/assets/*.js >/dev/null || { echo "缺 JS 产物"; exit 1; }
          ls spa/dist/assets/*.css >/dev/null || { echo "缺 CSS 产物"; exit 1; }
          # 字体缺失时公式会静默退化成后备字形——显示得出来但字是错的
          count=$(ls spa/dist/assets/fonts/*.woff2 2>/dev/null | wc -l)
          test "$count" -gt 0 || { echo "缺 KaTeX 字体，公式会用后备字形"; exit 1; }
          echo "产物完整，KaTeX 字体 $count 个"

  # 后端：vet + 全部 go 测试
  backend:
    runs-on: ubuntu-latest

    # 挂一个真实 Postgres，专门给 SQL 的 PREPARE 校验用。
    #
    # 为什么值得多这一个 service：新建文档那条 INSERT 曾经必然失败
    # （参数类型推导冲突，SQLSTATE 42P08），而当时所有测试都是绿的 —— 因为它们
    # 只断言源码文本里有没有某些字符串，而类型推导只有 Postgres 的解析器知道。
    # 表现是前端无限重试、页面永远「加载中」，界面上看不出任何 SQL 线索。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: koinote
          POSTGRES_PASSWORD: koinote
          POSTGRES_DB: koinote
        ports:
          - 5432:5432
        # 等健康再跑，否则测试可能在库起来之前就连
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # 跟着 backend/go.mod 走，避免版本漂移
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        # -race 打开：会话签名、限流器都有并发读写（限流器带 mutex，
        # 而 rateLimiter 正是最该验竞态的地方）
        #
        # TEST_DATABASE_URL 让真实 PostgreSQL 校验真正跑起来 —— 不设的话
        # 它们会 skip，包括 SQL 类型推导和跨引擎正则捕获语义断言。
        env:
          TEST_DATABASE_URL: postgres://koinote:koinote@localhost:5432/koinote?sslmode=disable
        run: go test -race ./...

      # 确认上一步没有静默 skip 掉数据库校验。
      #
      # 必要性：没有 TEST_DATABASE_URL 时这些测试会 skip，而 go test 对 skip
      # 报的是 ok —— 于是「连不上库」和「SQL 都没问题」在退出码上无法区分，
      # 这道防线可以在无人察觉的情况下失效。
      - name: 确认 PostgreSQL 校验真的跑了
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgres://koinote:koinote@localhost:5432/koinote?sslmode=disable
        run: |
          out=$(go test -count=1 ./internal/server/ -run '^(TestAllSQLPrepares|TestImageKeyPatternMatchesPostgres|TestDesktopAuthorizationEndToEnd|TestWechatOfficialMultiAccountPersistence|TestWechatCoverGenerationChargesFixedCredits)$' -v 2>&1)
          echo "$out"
          if echo "$out" | grep -q "SKIP"; then
            echo "::error::PostgreSQL 校验被 skip 了 —— 数据库没连上，这道防线形同不存在"
            exit 1
          fi
          for test_name in TestAllSQLPrepares TestImageKeyPatternMatchesPostgres TestDesktopAuthorizationEndToEnd TestWechatOfficialMultiAccountPersistence TestWechatCoverGenerationChargesFixedCredits; do
            echo "$out" | grep -q -- "--- PASS: $test_name" || {
              echo "::error::$test_name 未见通过标记"
              exit 1
            }
          done

      # 编译通得过才算完。test 只编译被测包，main 包不在其中
      - name: 构建
        working-directory: backend
        run: go build ./...

  # 桌面客户端必须在两个目标系统上都编译。macOS 的 Keychain 和 Windows 的
  # Credential Manager 走不同后端，只在 Linux 上 cargo check 会漏掉平台问题。
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run build
      - run: npm run desktop:check

  # 密钥卫生：防止 .env / 硬编码密钥被提交进来
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 不能提交 env 文件
        run: |
          # .env.example 是模板，必须在库里；其余 .env* 一律不许
          bad=$(git ls-files | grep -E '^\.env' | grep -v '^\.env\.example$' || true)
          if [ -n "$bad" ]; then echo "以下 env 文件被提交了：$bad"; exit 1; fi
          bad=$(git ls-files | grep -E '^\.dev\.vars' || true)
          if [ -n "$bad" ]; then echo "以下 wrangler 变量文件被提交了：$bad"; exit 1; fi

      - name: .env.example 里的凭据必须留空
        run: |
          # BACKEND_INTERNAL_TOKEN 这个头能让持有者伪造成任意用户（后端见到它就信
          # X-Auth-User-Id 给的身份，不再校验会话），等同于全站管理员凭据。
          # 曾经在 .env.example 里给了 koinote-internal-dev-token 作为示例值 ——
          # 开源之后那就是一把公开的万能钥匙，而 README 第一步就是 cp 成 .env。
          # backend 侧另有 TestExampleEnvHasNoUsableInternalToken。
          bad=$(grep -E '^(BACKEND_INTERNAL_TOKEN|SESSION_SECRET|MCP_TOKEN_ENCRYPTION_KEY|EMAIL_VERIFICATION_SECRET|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|BOT_WEBHOOK|BOT_WEBHOOK_SECRET|CLOUDFLARE_ANALYTICS_TOKEN)=.+' .env.example || true)
          if [ -n "$bad" ]; then
            echo "以下凭据在 .env.example 里有值，必须留空：$bad"; exit 1
          fi
          echo "凭据类变量均留空"

      - name: 不能有硬编码会话密钥
        env:
          # 拆成两半再拼，这样这个文件里不出现完整字符串。
          #
          # 直接写字面量的话，git grep 会命中 ci.yml 自己这一行 —— 检查被自己判为
          # 失败。第一次 CI 就是这么红的：本地手动跑那条 grep 是过的（当时 ci.yml
          # 还没提交进 git，git grep 只搜已跟踪文件），一提交上去就命中自己。
          #
          # 同理排除 _test.go：那条 Go 断言
          # （TestNoHardcodedSessionSecretInSource）本身要提到这个字符串才能检查它。
          NEEDLE_A: koinote-dev
          NEEDLE_B: session-secret
        run: |
          # 这个常量曾经是 sessionSecret() 的兜底值。开源之后它等于公开签名密钥，
          # 任何人拿它就能签出任意用户的会话。已删除，这里防止被"顺手"加回来。
          needle="${NEEDLE_A}-${NEEDLE_B}"
          if git grep -n -- "$needle" ':!*_test.go' ':!.github/workflows/ci.yml' ; then
            echo "::error::发现硬编码会话密钥"; exit 1
          fi
          echo "无硬编码密钥"
