name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-26
            target: aarch64-apple-darwin
          - label: macOS Intel
            os: macos-26
            target: x86_64-apple-darwin
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查更新签名密钥
        shell: bash
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "缺 TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || { echo "缺 TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: ${{ matrix.target }}

      - run: npm ci

      # Tauri 2.11.x 在临时目录内编译 .icon 时会触发 actool 崩溃：
      # https://github.com/tauri-apps/tauri/issues/15315
      # 先从源码目录直接生成 Assets.car，再让 Tauri 复制成品；重试用于规避
      # ibtoold 偶发残留状态。Windows 继续使用原配置，不执行这一步。
      - name: 预编译 macOS 原生图标
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          generated=""
          for attempt in 1 2 3; do
            attempt_dir=$(mktemp -d)
            output_dir="$attempt_dir/out"
            mkdir -p "$output_dir"
            if actool src-tauri/icons/AppIcon.icon \
              --compile "$output_dir" \
              --output-format human-readable-text \
              --notices --warnings \
              --output-partial-info-plist "$output_dir/assetcatalog_generated_info.plist" \
              --app-icon Icon \
              --include-all-app-icons \
              --accent-color AccentColor \
              --enable-on-demand-resources NO \
              --development-region en \
              --target-device mac \
              --minimum-deployment-target 26.0 \
              --platform macosx && test -f "$output_dir/Assets.car"; then
              cp "$output_dir/Assets.car" src-tauri/icons/Assets.car
              generated="yes"
              break
            fi
            echo "::warning::actool 第 $attempt 次执行失败，清理 ibtoold 后重试"
            killall ibtoold >/dev/null 2>&1 || true
          done
          test -n "$generated" || {
            echo "::error::无法从 AppIcon.icon 生成 Assets.car"
            exit 1
          }
          node <<'NODE'
          const fs = require("node:fs");
          const path = "src-tauri/tauri.conf.json";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          config.bundle.icon = config.bundle.icon.map((icon) =>
            icon === "icons/AppIcon.icon" ? "icons/Assets.car" : icon,
          );
          fs.writeFileSync(path, `${JSON.stringify(config, null, 2)}\n`);
          NODE

      - run: npm run desktop:build -- --target ${{ matrix.target }}

      - name: 验证 macOS DMG 与应用签名完整性
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "期望生成一个 DMG，实际 ${#dmgs[@]} 个"
            exit 1
          fi
          hdiutil verify "${dmgs[0]}"
          mount_dir=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "${dmgs[0]}" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app="$mount_dir/Koinote.app"
          test -f "$app/Contents/Resources/Assets.car" || {
            echo "::error::Assets.car 缺失，macOS 26 原生图标未生成（请检查 actool 版本是否不低于 26）"
            exit 1
          }
          codesign --verify --deep --strict --verbose=4 "$app"
          identifier=$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^Identifier=//p')
          if [ "$identifier" != "app.koinote.desktop" ]; then
            echo "应用签名标识错误：$identifier"
            exit 1
          fi

      - name: 收集安装包与自动更新包
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          bundle_dir="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-upload
          if [ "$RUNNER_OS" = "macOS" ]; then
            installers=("$bundle_dir"/dmg/*.dmg)
            updaters=("$bundle_dir"/macos/*.app.tar.gz)
            updater_name="Koinote_${version}_${{ matrix.target }}.app.tar.gz"
          else
            installers=("$bundle_dir"/msi/*.msi "$bundle_dir"/nsis/*-setup.exe)
            updaters=("$bundle_dir"/nsis/*-setup.exe)
            updater_name=""
          fi
          if [ "${#installers[@]}" -lt 1 ]; then
            echo "没有找到用户安装包"
            exit 1
          fi
          if [ "${#updaters[@]}" -ne 1 ] || [ ! -f "${updaters[0]}.sig" ]; then
            echo "自动更新包或签名数量不正确"
            exit 1
          fi
          if [ -z "$updater_name" ]; then
            updater_name=$(basename "${updaters[0]}")
          fi
          cp "${installers[@]}" release-upload/
          cp "${updaters[0]}" "release-upload/$updater_name"
          cp "${updaters[0]}.sig" "release-upload/$updater_name.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: release-upload/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与客户端版本一致
        shell: bash
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "desktop-v$app_version" != "$GITHUB_REF_NAME" ]; then
            echo "标签 $GITHUB_REF_NAME 与客户端版本 $app_version 不一致"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: 生成更新清单、校验值与发布说明
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#desktop-v}
          mac_arm_name="Koinote_${version}_aarch64-apple-darwin.app.tar.gz"
          mac_intel_name="Koinote_${version}_x86_64-apple-darwin.app.tar.gz"
          windows_name="Koinote_${version}_x64-setup.exe"
          for updater in "$mac_arm_name" "$mac_intel_name" "$windows_name"; do
            test -f "release-artifacts/$updater" || { echo "缺更新包 $updater"; exit 1; }
            test -f "release-artifacts/$updater.sig" || { echo "缺更新签名 $updater.sig"; exit 1; }
          done
          release_base="https://downloads.koinote.app/desktop-updates"
          pub_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          notes="Koinote Desktop $version adds one-click Agent repository uploads and encrypted development/AI configuration snapshots, with file previews and sensitive-data filtering. Cloud changes refresh automatically while local edits upload after 20 seconds of inactivity. Updating an older configuration snapshot removes Agent files from that snapshot; export them or upload them to an Agent repository first. Local files remain unchanged."
          jq -n \
            --arg version "$version" \
            --arg notes "$notes" \
            --arg pub_date "$pub_date" \
            --arg mac_arm_signature "$(tr -d '\r\n' < "release-artifacts/$mac_arm_name.sig")" \
            --arg mac_arm_url "$release_base/$mac_arm_name" \
            --arg mac_intel_signature "$(tr -d '\r\n' < "release-artifacts/$mac_intel_name.sig")" \
            --arg mac_intel_url "$release_base/$mac_intel_name" \
            --arg windows_signature "$(tr -d '\r\n' < "release-artifacts/$windows_name.sig")" \
            --arg windows_url "$release_base/$windows_name" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $mac_arm_signature, url: $mac_arm_url },
                "darwin-x86_64": { signature: $mac_intel_signature, url: $mac_intel_url },
                "windows-x86_64": { signature: $windows_signature, url: $windows_url }
              }
            }' > release-artifacts/latest.json
          (
            cd release-artifacts
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum
          ) > release-artifacts/SHA256SUMS.txt
          cat > release-notes.md <<EOF
          # Koinote Desktop $version (Alpha)

          Koinote 桌面客户端采用本地优先的 SQLite 存储，支持离线编辑、后台同步与冲突双副本恢复。

          - 「我的空间」新增 Skills/Agent 仓库和「开发/AI 配置云端同步」，分别管理 Agent 内容与私人配置。
          - 客户端支持一键扫描、文件树勾选、内容预览和上传；自动排除可能包含敏感信息的文件，手动选回时需明确确认。也可通过 MCP 连接 Agent。
          - 开发/AI 配置以加密快照保存；恢复到本机前列出目标路径、备份已有文件，并对高危路径再次确认。
          - 本地未编辑时也会获取云端更新：启动、重连、切回窗口时检查，前台每 30 秒检查一次。上传仅由本地改动触发，停止输入 20 秒后执行。
          - 后台无变化或检查失败时不打扰；保留未保存草稿和冲突双副本，修复文档移动与手动同步的并发问题。
          - 更新旧版配置快照时，会从快照中移除 \`CLAUDE.md\`、\`.claude/skills/*\` 等 Agent 文件。请先导出或上传至 Agent 仓库；本机文件不受影响。

          从 0.1.4 起，客户端会在启动后自动检查 Cloudflare R2 更新服务，也可以在账户菜单中手动检查、下载并重启安装更新。

          - **macOS Apple 芯片**：文件名包含 \`aarch64\`
          - **macOS Intel 芯片**：文件名包含 \`x64\`
          - **Windows 64 位**：可选择 NSIS \`.exe\` 或 MSI \`.msi\`

          当前 Alpha 安装包尚未购买代码签名证书。macOS 包已进行 ad-hoc 完整性签名，但没有 Apple Developer ID 与公证；首次运行请右键应用并选择“打开”，较新的 macOS 如仍拦截，请前往“系统设置 → 隐私与安全性”选择“仍要打开”。若系统仍提示应用“已损坏”，请先核对本页的 SHA-256，再运行 \`xattr -dr com.apple.quarantine /Applications/Koinote.app\`。Windows 出现 SmartScreen 时请核对本页的 SHA-256 后选择“更多信息 → 仍要运行”。

          ---

          Koinote Desktop uses local-first SQLite storage with offline editing, background synchronization, and explicit conflict recovery.

          - My Space now separates Skills/Agent repositories from private development/AI configuration snapshots.
          - Scan, select, preview, and upload local files in the client. Potentially sensitive files are excluded by default and require explicit confirmation to include; MCP access remains available.
          - Store encrypted configuration snapshots, preview restore paths, back up existing files, and confirm high-risk paths separately before restoring to this computer.
          - Receive cloud changes even without local edits: check at startup, on reconnection and window focus, and every 30 seconds while visible. Local edits upload after 20 seconds of inactivity.
          - Keep unchanged or failed background checks quiet, preserve unsaved drafts and conflict copies, and fix concurrent document moves and manual sync requests.
          - Updating an older configuration snapshot removes Agent files such as \`CLAUDE.md\` and \`.claude/skills/*\` from that snapshot. Export them or upload them to an Agent repository first; local files remain unchanged.

          Starting with 0.1.4, the client checks the Cloudflare R2 update service automatically and can download, install, and restart from the account menu.

          These Alpha installers do not use paid platform certificates. The macOS builds are integrity-protected with an ad-hoc signature but are not signed with an Apple Developer ID or notarized. Right-click the app and choose **Open** the first time; on newer macOS releases, you may also need **System Settings → Privacy & Security → Open Anyway**. If macOS still reports that the app is damaged, verify its SHA-256 checksum first, then run \`xattr -dr com.apple.quarantine /Applications/Koinote.app\`. On Windows, verify the SHA-256 checksum before choosing **More info → Run anyway** in SmartScreen.
          EOF

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: 上传桌面更新包到 R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for file in release-artifacts/*; do
            name=$(basename "$file")
            [ "$name" = "latest.json" ] && continue
            case "$name" in
              *.sig|*.txt) content_type="text/plain; charset=utf-8"; cache_control="public, max-age=31536000, immutable" ;;
              *.app.tar.gz) content_type="application/gzip"; cache_control="public, max-age=31536000, immutable" ;;
              *.dmg) content_type="application/x-apple-diskimage"; cache_control="public, max-age=31536000, immutable" ;;
              *.msi) content_type="application/x-msi"; cache_control="public, max-age=31536000, immutable" ;;
              *.exe) content_type="application/vnd.microsoft.portable-executable"; cache_control="public, max-age=31536000, immutable" ;;
              *) echo "未知桌面产物类型：$name"; exit 1 ;;
            esac
            npx wrangler r2 object put \
              "koinote-desktop-releases/desktop-updates/$name" \
              --remote --file "$file" --content-type "$content_type" \
              --cache-control "$cache_control" -y
          done
          npx wrangler r2 object put \
            "koinote-desktop-releases/desktop-updates/latest.json" \
            --remote --file release-artifacts/latest.json \
            --content-type "application/json" \
            --cache-control "public, max-age=30, must-revalidate" -y

      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mapfile -d '' assets < <(find release-artifacts -type f -print0 | sort -z)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Koinote Desktop ${GITHUB_REF_NAME#desktop-v} (Alpha)" \
            --notes-file release-notes.md
