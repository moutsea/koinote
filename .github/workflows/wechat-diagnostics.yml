name: WeChat Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Read recent WeChat draft failure summaries
        env:
          HOST: ${{ secrets.VPS_HOST }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          count=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "root@$HOST" 'bash -eo pipefail -s' 2>/dev/null <<'REMOTE'
          cd /opt/koinote
          docker compose logs --since=24h --no-color backend | awk '/wechat draft image transfer/ {n++} END {print n+0}'
          REMOTE
          )
          [[ "$count" =~ ^[0-9]{1,12}$ ]] || exit 1
          echo "WeChat draft image transfer failures in the last 24 hours: $count"
