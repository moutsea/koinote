services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-koinote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-koinote}
      POSTGRES_DB: ${POSTGRES_DB:-koinote}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - koinote-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-koinote} -d ${POSTGRES_DB:-koinote}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - koinote-network

  backend:
    build:
      context: ./backend
    image: koinote-backend:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgres://${POSTGRES_USER:-koinote}:${POSTGRES_PASSWORD:-koinote}@postgres:5432/${POSTGRES_DB:-koinote}?sslmode=disable
      AUTO_MIGRATE: "true"
      MIGRATIONS_DIR: /app/migrations
      SESSION_SECRET: ${SESSION_SECRET:-}
      BACKEND_INTERNAL_TOKEN: ${BACKEND_INTERNAL_TOKEN:-}
      MCP_TOKEN_ENCRYPTION_KEY: ${MCP_TOKEN_ENCRYPTION_KEY:-}
      LLM_CREDENTIAL_ENCRYPTION_KEY: ${LLM_CREDENTIAL_ENCRYPTION_KEY:-}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
      ENABLE_MOCK_EMAIL: ${ENABLE_MOCK_EMAIL:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_LIFETIME_PRODUCT_ID: ${STRIPE_LIFETIME_PRODUCT_ID:-}
      STRIPE_CREDITS_PRODUCT_ID: ${STRIPE_CREDITS_PRODUCT_ID:-}
      # 内置 Agent 模型四项齐全时启用；BYOK 只依赖独立的凭据加密密钥。
      AGENT_LLM_PROTOCOL: ${AGENT_LLM_PROTOCOL:-}
      AGENT_LLM_BASE_URL: ${AGENT_LLM_BASE_URL:-}
      AGENT_LLM_API_KEY: ${AGENT_LLM_API_KEY:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      # 飞书付款通知与 Kimiseek 复用同名配置；两项齐全且为 production 时启用。
      BOT_WEBHOOK: ${BOT_WEBHOOK:-}
      BOT_WEBHOOK_SECRET: ${BOT_WEBHOOK_SECRET:-}
      # Admin 的 Cloudflare UV/PV。Token 缺失时只隐藏流量卡片，不影响业务统计。
      CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
      CLOUDFLARE_ANALYTICS_TOKEN: ${CLOUDFLARE_ANALYTICS_TOKEN:-}
      CLOUDFLARE_ANALYTICS_HOST: ${CLOUDFLARE_ANALYTICS_HOST:-}
      # Admin 手动提醒由后端调用 LLM 翻译；API Key 绝不进入前端或 Worker。
      ANNOUNCEMENT_LLM_BASE_URL: ${ANNOUNCEMENT_LLM_BASE_URL:-}
      ANNOUNCEMENT_LLM_API_KEY: ${ANNOUNCEMENT_LLM_API_KEY:-}
      ANNOUNCEMENT_LLM_MODEL: ${ANNOUNCEMENT_LLM_MODEL:-}
      RELEASE_ANNOUNCEMENT_PATH: /app/release-announcement.json
      # 图片回收和邮箱验证码发信都由后端回调 Worker。生产环境必须配置；
      # 留空时图片待删记录仍会排队，但邮箱注册无法发送验证码。
      WORKER_URL: ${WORKER_URL:-}
      # 每用户云端存储上限（文档正文 + 图片），单位 MB。留空用后端默认的 500。
      # 非正数或非数字会回落到默认值，不会变成"谁都传不了图"
      IMAGE_QUOTA_MB: ${IMAGE_QUOTA_MB:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5273,http://localhost:3000}
      # OAuth：APP_URL 用于拼回调地址，须与各 provider 后台登记的地址完全一致。
      # 凭证留空时后端的 start 端点返回 501 oauth_not_configured。
      APP_URL: ${APP_URL:-http://localhost:5273}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    networks:
      - koinote-network

volumes:
  koinote-postgres-data:

networks:
  koinote-network:
    driver: bridge
