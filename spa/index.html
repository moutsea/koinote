<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />

    <title>Koinote — 个人 AI 知识文档库</title>

      name="description"
      content="Koinote 是个人 AI 知识文档库。用 Markdown 写作与整理，通过 MCP 让你的 Agent 安全检索、读取和修改文档。"

    <!-- 文件在仓库根的 public/（vite.config.ts 里 publicDir 指向那里，不是 spa/public/）。
         PNG 而非 SVG：logo 是真实水墨笔触，有笔丝、墨色渐变和飞白，矢量化会把
         笔锋全洗掉。
         favicon 用「焦墨底 + 反白笔触」而不是站内那张透明淡墨图：细笔触缩到
         32px 会淡到认不出，而且透明底在深色标签栏上直接消失。深底在两种标签栏
         上都立得住，一张够用。 -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
