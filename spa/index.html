<!doctype html>
<html lang="zh-CN" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Koinote — 在线 Markdown 编辑器</title>
    <meta
      name="description"
      content="Typora 式所见即所得的在线 Markdown 编辑器，边写边渲染，随时导出。"
    />
    <!-- 文件在仓库根的 public/（vite.config.ts 里 publicDir 指向那里，不是 spa/public/）。
         PNG 而非 SVG：logo 是真实水墨笔触，有笔丝、墨色渐变和飞白，矢量化会把
         笔锋全洗掉。
         favicon 用「焦墨底 + 反白笔触」而不是站内那张透明淡墨图：细笔触缩到
         32px 会淡到认不出，而且透明底在深色标签栏上直接消失。深底在两种标签栏
         上都立得住，一张够用。 -->
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body class="min-h-full">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
