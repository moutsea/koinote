[package]
name = "koinote-desktop"
version = "0.1.10"
description = "Koinote offline desktop client"
authors = ["Koinote contributors"]
license = "MIT"
repository = "https://github.com/moutsea/koinote"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "koinote_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-updater = "2.10.1"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native"] }
